<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | News Portal</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-600">

    <div class="w-full max-w-md">

        <div class="backdrop-blur-lg bg-white/20 border border-white/30 p-8 rounded-3xl shadow-2xl hover:scale-105 transition duration-300">

            <div class="text-center mb-4">
                <div class="text-6xl mb-3">🌐</div>
                <h1 class="text-4xl font-bold text-white">
                    Register
                </h1>
                <p class="text-gray-200 mt-2">
                    News Portal hesabın jaratıń
                </p>
            </div>

         {% if form.errors %}
<div class="bg-red-500/20 border border-red-300 text-white p-3 rounded-xl mb-5 text-sm">
    {{ form.errors }}
</div>
{% endif %}

            <form method="POST">
                {% csrf_token %}

                <div class="mb-4">
                    <label class="block text-white font-medium mb-2">
                        Username
                    </label>
                    {{ form.username }}
                </div>

                <div class="mb-4">
                    <label class="block text-white font-medium mb-2">
                        Password
                    </label>
                    {{ form.password1 }}
                </div>

                <div class="mb-6">
                    <label class="block text-white font-medium mb-2">
                        Confirm Password
                    </label>
                    {{ form.password2 }}
                </div>

                <button
                    type="submit"
                    class="w-full bg-white text-blue-600 font-bold py-3 rounded-xl hover:bg-blue-50 transition duration-300 shadow-lg">
                    Register
                </button>

                <p class="text-center text-white mt-6">
                    Already have an account?
                    <a href="{% url 'login' %}"
                       class="font-bold underline hover:text-yellow-300">
                        Login
                    </a>
                </p>
            </form>

        </div>

        <p class="text-center text-white mt-6 text-sm">
            © 2026 News Portal. All rights reserved.
        </p>

    </div>

</body>
</html>
