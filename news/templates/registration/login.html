<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | News Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-600">

```
<div class="w-full max-w-md px-4">

    <div class="backdrop-blur-2xl bg-white/10 border border-white/20 p-8 rounded-3xl shadow-2xl">

        <div class="text-center mb-6">
            <div class="text-7xl mb-3">🔐</div>

            <h1 class="text-4xl font-bold text-white">
                Login
            </h1>

            <p class="text-gray-200 mt-2">
                News Portal hesabına kiriń
            </p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="bg-green-500 text-white p-3 rounded-lg mb-4">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-4">
                <label class="block text-white font-semibold mb-2">
                    👤 Username
                </label>
                {{ form.username }}
            </div>

            <div class="mb-6">
                <label class="block text-white font-semibold mb-2">
                    🔒 Password
                </label>
                {{ form.password }}
            </div>

            <button
                type="submit"
                class="w-full bg-white text-blue-600 font-bold py-3 rounded-xl shadow-lg hover:bg-blue-600 hover:text-white transition duration-300">
                Kiriw
            </button>

            <p class="text-center text-white mt-6">
                Account joq pa?
                <a href="{% url 'register' %}"
                   class="font-bold underline hover:text-yellow-300">
                    Register
                </a>
            </p>

        </form>

    </div>

    <p class="text-center text-white/80 mt-6 text-sm">
        © 2026 News Portal. All rights reserved.
    </p>

</div>
```

</body>
</html>
